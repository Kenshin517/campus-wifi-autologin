name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    name: Linux - lint, build and install .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck
        run: |
          shellcheck -x \
            linux/bin/campus-wifi-autologin \
            linux/*.sh \
            linux/networkmanager/90-campus-wifi-autologin \
            linux/debian/config linux/debian/postinst linux/debian/prerm linux/debian/postrm

      - name: Build .deb
        run: linux/build-deb.sh

      - name: Install, smoke test and purge
        run: |
          printf '%s\n' \
            'campus-wifi-autologin campus-wifi-autologin/netid string ci-user' \
            'campus-wifi-autologin campus-wifi-autologin/password password ci-pass' \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/campus-wifi-autologin_*_all.deb
          campus-wifi-autologin version
          sudo test "$(stat -c '%a %U' /etc/campus-wifi-autologin/config)" = "600 root"
          systemd-analyze verify /usr/lib/systemd/system/campus-wifi-autologin.service \
                                 /usr/lib/systemd/system/campus-wifi-autologin.timer
          systemctl is-enabled campus-wifi-autologin.timer
          sudo campus-wifi-autologin run
          sudo apt-get purge -y campus-wifi-autologin
          test ! -e /etc/campus-wifi-autologin

  windows:
    name: Windows - PowerShell analysis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse and ASCII check
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem windows -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Error "$($f.Name): $($_.Message)" } }
            if ([IO.File]::ReadAllBytes($f.FullName) | Where-Object { $_ -gt 127 }) {
              $failed = $true; Write-Error "$($f.Name) contains non-ASCII characters (breaks Windows PowerShell 5.1)"
            }
          }
          if ($failed) { exit 1 }

      - name: Install and uninstall under an Indonesian locale
        shell: pwsh
        run: |
          # Regression test: id-ID uses '.' as time separator, which once broke the task XML.
          Set-Culture id-ID
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "
            `$pw = ConvertTo-SecureString 'ci-pass' -AsPlainText -Force
            & '.\windows\Install.ps1' -NetId 'ci-user' -Password `$pw
            if (-not `$?) { exit 1 }"
          $task = Get-ScheduledTask -TaskName CampusWifiAutologin -ErrorAction Stop
          $task.Triggers | Format-Table -AutoSize
          if ($task.Principal.UserId -ne 'SYSTEM') { throw "Task must run as SYSTEM, got $($task.Principal.UserId)" }
          if (-not (Test-Path "$env:ProgramData\CampusWifiAutologin\config.json")) { throw 'config.json missing' }
          # The first run must leave visible evidence in the log and state file.
          $log = Get-Content "$env:ProgramData\CampusWifiAutologin\autologin.log" -Raw
          Write-Host $log
          if ($log -notmatch 'OK: online|SUCCESS|Connected to') { throw 'first run wrote no status line to the log' }
          if (-not (Test-Path "$env:ProgramData\CampusWifiAutologin\state.json")) { throw 'state.json missing' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\Status.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\Uninstall.ps1
          if (Get-ScheduledTask -TaskName CampusWifiAutologin -ErrorAction SilentlyContinue) { throw 'task not removed' }

      - name: Batch launchers survive awkward folder names
        shell: pwsh
        run: |
          # Regression test: a ')' in the path (e.g. "...-master (1)") used to make
          # install.bat abort silently. Stub scripts are used so no prompt appears.
          $dir = Join-Path $env:RUNNER_TEMP "campus-wifi-autologin-master (1) & it's\windows"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item windows\*.bat $dir
          foreach ($name in 'Install', 'Uninstall', 'Status') {
            Set-Content (Join-Path $dir "$name.ps1") "Set-Content -LiteralPath (Join-Path `$PSScriptRoot 'ran.txt') '$($name.ToLower())'"
          }
          foreach ($bat in 'install', 'uninstall', 'status') {
            Remove-Item (Join-Path $dir 'ran.txt') -ErrorAction SilentlyContinue
            $out = cmd.exe /c "`"$(Join-Path $dir "$bat.bat")`" < nul" 2>&1 | Out-String
            $ran = Get-Content (Join-Path $dir 'ran.txt') -ErrorAction SilentlyContinue
            if ($ran -ne $bat) { Write-Host $out; throw "$bat.bat did not run its script from '$dir'" }
            Write-Host "$bat.bat OK"
          }

          # Running install.bat on its own (e.g. straight from inside the ZIP) must explain itself.
          $lonely = Join-Path $env:RUNNER_TEMP 'lonely'
          New-Item -ItemType Directory -Path $lonely -Force | Out-Null
          Copy-Item windows\install.bat $lonely
          $out = cmd.exe /c "`"$lonely\install.bat`" < nul" 2>&1 | Out-String
          if ($out -notmatch 'Extract') { Write-Host $out; throw 'install.bat did not explain the missing files' }
          Write-Host 'missing-files message OK'

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
